name: Deploy demo and API docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "packages/granboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            packages/granboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # API reference from the package's TSDoc comments, served at /api/.
      - run: npm ci
        working-directory: packages/granboard
      - run: npm run docs -- --out ../../demo/dist/api
        working-directory: packages/granboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
